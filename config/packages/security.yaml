security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        admin_provid:
            entity:
                class: App\Entity\User
                property: username
        users_in_memory: { memory: null }

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
            
        admin_secur:
            pattern: ^/admin
            lazy: true  # Remplace 'anonymous: true'
            provider: admin_provid
            form_login: 
                login_path: login # Attention: utilisez '_' et non '-'
                check_path: login
                enable_csrf: true # Recommandé en Symfony 7+
                default_target_path: admin   # redirection après succès
            logout:
                path: /logout
                target: /
                
        main:
            lazy: true
            provider: users_in_memory
            # ... reste de votre config

    access_control:
        # Autorise l'accès à la page de login sans être connecté
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        # Restreint le reste de l'admin
        - { path: ^/admin, roles: [ROLE_ADMIN, ROLE_SUPER_ADMIN] }